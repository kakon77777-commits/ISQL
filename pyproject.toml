[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "isql-core-runtime"
version = "1.0.0"
description = "ISQL Core Runtime v1.0 with compact machine-native locality indexing and actual-byte base selection for AI-native one-hop delta memory."
requires-python = ">=3.11"
authors = [{name = "Neo.K / EVEMISSLAB"}]

[project.scripts]
isql-core = "isql_core.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
isql_core = ["data/*.json"]
