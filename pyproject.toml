[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "isql-core-runtime"
version = "0.3.0"
description = "ISQL Core Runtime with registry-backed spectral coordinate compaction for multi-resolution AI memory."
requires-python = ">=3.11"
authors = [{name = "Neo.K / EVEMISSLAB"}]

[project.scripts]
isql-core = "isql_core.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
isql_core = ["data/*.json"]
