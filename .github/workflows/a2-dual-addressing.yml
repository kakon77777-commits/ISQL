name: A2 dual addressing prototype

on:
  pull_request:
    paths:
      - "src/isql_core/semantic_addressing.py"
      - "src/isql_core/__init__.py"
      - "tests/test_semantic_addressing.py"
      - "docs/internal/ISQL_Dual_Addressing_Prototype_v0.1.md"
      - ".github/workflows/a2-dual-addressing.yml"
  push:
    branches:
      - "agent/dual-address-a2-prototype"

jobs:
  dual-addressing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Core source
        run: python -m pip install -e .
      - name: Compile source
        run: python -m compileall -q src
      - name: Run dual addressing and semantic boundary tests
        run: >-
          python -m unittest -v
          tests.test_semantic_addressing
          tests.test_semantics
          tests.test_native_frame
          tests.test_isx_frame
